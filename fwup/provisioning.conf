# What flashing a device writes to its key/value store. Each escaped variable
# is filled in when a card is written.

# Identity
uboot_setenv(uboot-env, "nerves_serial_number", "\${NERVES_SERIAL_NUMBER}")
uboot_setenv(uboot-env, "fostrom_layout_generation", ${FOSTROM_LAYOUT_GENERATION})

# Enrollment
uboot_setenv(uboot-env, "fostrom_fleet_id", "\${FOSTROM_FLEET_ID}")
uboot_setenv(uboot-env, "fostrom_fleet_token", "\${FOSTROM_FLEET_TOKEN}")
uboot_setenv(uboot-env, "fostrom_flashed_at", "\${FOSTROM_FLASHED_AT}")
uboot_setenv(uboot-env, "fostrom_endpoint", "\${FOSTROM_ENDPOINT}")
uboot_setenv(uboot-env, "fostrom_tags", "\${FOSTROM_TAGS}")
uboot_setenv(uboot-env, "fostrom_user_data", "\${FOSTROM_USER_DATA}")

# Policy
uboot_setenv(uboot-env, "fostrom_validation_requires_cloud", "\${FOSTROM_VALIDATION_REQUIRES_CLOUD}")
uboot_setenv(uboot-env, "fostrom_hardware_bound", "\${FOSTROM_HARDWARE_BOUND}")

# Network
uboot_setenv(uboot-env, "fostrom_wifi_networks", "\${FOSTROM_WIFI_NETWORKS}")
uboot_setenv(uboot-env, "fostrom_wifi_country", "\${FOSTROM_WIFI_COUNTRY}")
uboot_setenv(uboot-env, "fostrom_network", "\${FOSTROM_NETWORK}")
