# Partition layout and firmware identity for {{.Target}}

# Firmware identity
define(NERVES_FW_PRODUCT, "Fostrom OS")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "{{.Platform}}")
define(NERVES_FW_ARCHITECTURE, "{{.Architecture}}")
define(NERVES_FW_AUTHOR, "Fostrom")

# Block cache
block-cache-size-mb = 32

# Device paths
define(NERVES_FW_DEVPATH, "/dev/rootdisk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/rootdisk0p10")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "ext4")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Layout generation and root filesystem image
define(FOSTROM_LAYOUT_GENERATION, 1)

define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Geometry, in 512 byte blocks
#   LBA 0         MBR, with no boot code
#   LBA 2048      firmware key/value store, two copies of 32 KiB
#   p1  ESP       grub.cfg, grubenv, EFI/BOOT/{{.EFI | upper}}
#   p4  extended container
#     p5   provisioning  ext4, 16 MiB
#     p6   rootfs A      squashfs
#     p7   rootfs B      squashfs
#     p8   appcode A     squashfs
#     p9   appcode B     squashfs
#     p10  app data      grows to fill the disk
define(UBOOT_ENV_OFFSET, 2048)
define(UBOOT_ENV_COUNT, 64)
define-eval(UBOOT_ENV_REDUND_OFFSET, "${UBOOT_ENV_OFFSET} + ${UBOOT_ENV_COUNT}")

define(BOOT_PART_OFFSET, 4096)
define(BOOT_PART_COUNT, 31232)

define(EXTENDED_PART_OFFSET, 36864)

define(EBR_GAP, 2048)

define-eval(PROVISIONING_PART_OFFSET, "${EXTENDED_PART_OFFSET} + ${EBR_GAP}")
define(PROVISIONING_PART_COUNT, 32768)

define-eval(ROOTFS_A_PART_OFFSET, "${PROVISIONING_PART_OFFSET} + ${PROVISIONING_PART_COUNT} + ${EBR_GAP}")
define(ROOTFS_A_PART_COUNT, 4194304)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT} + ${EBR_GAP}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

define-eval(APPCODE_A_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT} + ${EBR_GAP}")
define(APPCODE_A_PART_COUNT, 2097152)
define-eval(APPCODE_B_PART_OFFSET, "${APPCODE_A_PART_OFFSET} + ${APPCODE_A_PART_COUNT} + ${EBR_GAP}")
define(APPCODE_B_PART_COUNT, ${APPCODE_A_PART_COUNT})

define-eval(APP_PART_OFFSET, "${APPCODE_B_PART_OFFSET} + ${APPCODE_B_PART_COUNT} + ${EBR_GAP}")
define(APP_PART_COUNT, 2097152)
define-eval(APP_PART_LAST_OFFSET, "${APP_PART_OFFSET} + ${APP_PART_COUNT} - 1")

# Metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

# Partition table
mbr mbr {
    signature = 0x{{.Signature}}

    partition 0 {
        block-offset = ${BOOT_PART_OFFSET}
        block-count = ${BOOT_PART_COUNT}
        type = 0xef
        boot = true
    }
    partition 3 {
        type = 0xf
        block-offset = ${EXTENDED_PART_OFFSET}
    }
    partition 4 {
        block-offset = ${PROVISIONING_PART_OFFSET}
        block-count = ${PROVISIONING_PART_COUNT}
        type = 0x83
    }
    partition 5 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0x83
    }
    partition 6 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0x83
    }
    partition 7 {
        block-offset = ${APPCODE_A_PART_OFFSET}
        block-count = ${APPCODE_A_PART_COUNT}
        type = 0x83
    }
    partition 8 {
        block-offset = ${APPCODE_B_PART_OFFSET}
        block-count = ${APPCODE_B_PART_COUNT}
        type = 0x83
    }
    partition 9 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = 0x83
        expand = true
    }
}

# Firmware key/value store
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
    block-offset-redund = ${UBOOT_ENV_REDUND_OFFSET}
}
