# Boot script for {{.Target}}

load_env

# A/B fallback
if [ "${validated}" != "1" ]; then
    if [ "${booted_once}" = "1" ]; then
        echo "Firmware was not validated. Falling back to the other slot."
        if [ "${boot}" = "1" ]; then set boot=0; else set boot=1; fi

        set validated=1
        save_env boot validated
    else
        set booted_once=1
        save_env booted_once
    fi
fi

# The disk this file was loaded from
set disk=hd0
if regexp -s from_root '^([^,]+),' "$root"; then
    set disk=$from_root
fi

# The slot to boot
if [ "${boot}" = "1" ]; then
    set slot=($disk,msdos7)
    set partuuid={{.Signature}}-07
    echo "Booting partition B..."
else
    set slot=($disk,msdos6)
    set partuuid={{.Signature}}-06
    echo "Booting partition A..."
fi

# Kernel, and an initrd where the slot has one
linux ${slot}/boot/{{.Image}} root=PARTUUID=${partuuid} rootwait panic=10{{with .Console}} {{.}}{{end}}

if [ -f ${slot}/boot/initrd.img ]; then
    initrd ${slot}/boot/initrd.img
fi

boot
